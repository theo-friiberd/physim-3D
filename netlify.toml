# Netlify configuration for the 3D Physics Simulator.
# Pure static site: no build step, the repository root is published as-is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Security + default headers for every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Optional hardening (uncomment after testing with your own models):
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://www.gstatic.com; worker-src blob:; object-src 'none'; base-uri 'self'"

# ---------------------------------------------------------------------------
# CDN caching
# HTML is always revalidated so a new deploy is visible immediately.
# JS/CSS are cached for an hour in browsers and a day on the CDN edge;
# Netlify purges its edge cache automatically on every deploy.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Type = "text/css; charset=utf-8"

# Any static assets (sample models, icons, ...) you add later under /assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
