# Netlify configuration for the 3D Physics Simulator.
# Pure static site: no build step, the repository root is published as-is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Security + default headers for every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Optional hardening (uncomment after testing with your own models):
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://www.gstatic.com; worker-src blob:; object-src 'none'; base-uri 'self'"

# ---------------------------------------------------------------------------
# CDN caching
# Everything that makes up the app (HTML, JS modules, CSS) is revalidated on
# every load (cheap 304s via ETag), so a new deploy never mixes stale files with
# new ones. Netlify also purges its edge cache on every deploy.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/css; charset=utf-8"

# Any static assets (sample models, icons, ...) you add later under /assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
